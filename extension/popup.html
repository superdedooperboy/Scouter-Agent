<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 260px; margin: 0; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #17171c; color: #f4f4f6; }
  .hd { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; font-size: 15px; font-weight: 700; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #30c56a; box-shadow: 0 0 0 3px rgba(48,197,106,.2); }
  .body { padding: 0 16px 14px; }
  .stat { font-size: 26px; font-weight: 700; margin: 6px 0 0; }
  .lbl { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: #9a9aa3; }
  .meta { font-size: 12px; color: #b7b7c0; margin-top: 8px; }
  .foot { font-size: 11px; color: #8a8a93; border-top: 1px solid #2a2a31; padding: 10px 16px; }
</style>
</head>
<body>
  <div class="hd"><span class="dot"></span> Scouter Web Guard</div>
  <div class="body">
    <div class="lbl">Threats caught</div>
    <div class="stat" id="count">0</div>
    <div class="meta" id="meta">Watching every page for ClickFix scams &amp; phishing.</div>
  </div>
  <div class="foot">Runs locally in your browser. No account, nothing leaves this device.</div>
  <script src="popup.js"></script>
</body>
</html>
