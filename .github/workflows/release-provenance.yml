# Release provenance + signing.
#
# When a GitHub Release is published (the project's release flow creates one on the mac-v<ver>
# tag), this packages a deterministic source tarball of exactly the tagged tree and attaches:
#   * <name>.tar.gz             — the source bundle
#   * <name>.tar.gz.sha256      — its checksum
#   * <name>.tar.gz.cosign.bundle — a Sigstore keyless signature (verify with `cosign verify-blob`)
# and records a SLSA build-provenance attestation (verify with `gh attestation verify`).
#
# Nothing here changes how the agent is normally consumed (git pull / mesh update); it adds a
# verifiable, signed artifact for anyone who wants to pin to a release.
name: Release provenance + signing

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  provenance:
    name: Attest + sign the release tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload assets onto the release
      id-token: write        # keyless signing + provenance (OIDC)
      attestations: write    # store the build-provenance attestation
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build deterministic source tarball
        id: pack
        run: |
          set -euo pipefail
          TAG='${{ github.event.release.tag_name }}'
          NAME="scouter-agent-${TAG}"
          # git archive of HEAD (= the tagged commit we just checked out): only tracked files,
          # stable ordering, no build artifacts.
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          echo "tarball=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Generate build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab  # v4.1.4

      - name: Sign the tarball (keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${{ steps.pack.outputs.tarball }}.cosign.bundle" \
            "${{ steps.pack.outputs.tarball }}"

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload '${{ github.event.release.tag_name }}' \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.pack.outputs.tarball }}.sha256" \
            "${{ steps.pack.outputs.tarball }}.cosign.bundle" \
            --clobber
