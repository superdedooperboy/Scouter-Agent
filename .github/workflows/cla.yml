# CLA enforcement.
#
# Uses the contributor-assistant ACTION rather than the hosted cla-assistant.io service, so
# signatures are stored in this repository (on a separate branch) instead of with a third
# party. For a security project that is the right trade: one less external dependency
# holding a record of who contributed, and no service to outlive the project.
#
# The signature file is created automatically on the first signature — nothing to set up
# beyond enabling this workflow.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write          # to write the signature file on the storage branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on PR comments or PRs — not on plain issue comments.
    if: (github.event.issue.pull_request && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) || github.event_name == 'pull_request_target'
    steps:
      - name: CLA check
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/superdedooperboy/scouter-agent/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: superdedooperboy,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for the pull request — it can't be merged until the Contributor License
            Agreement is signed.

            Please read [CLA.md](https://github.com/superdedooperboy/scouter-agent/blob/main/CLA.md),
            then comment on this PR with exactly:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            Your signature is recorded against your GitHub account, so this is a one-time
            step. If you're contributing on behalf of an employer, please say so here first —
            employer IP clauses often cover side projects, and sorting it out now protects
            you as much as the project.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'CLA signed — thanks. Reviewing shortly.'
