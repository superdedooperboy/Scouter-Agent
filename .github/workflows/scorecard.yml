# OpenSSF Scorecard — supply-chain posture scoring.
#
# Publishes results (publish_results: true) so the badge at
# https://securityscorecards.dev/viewer/?uri=github.com/superdedooperboy/Scouter-Agent works,
# and uploads SARIF to the Security → Code scanning tab. Public repo only.
name: Scorecard supply-chain

on:
  branch_protection_rule:
  schedule:
    - cron: '19 5 * * 1'   # weekly, Monday 05:19 UTC
  push:
    branches: [ main ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results (OIDC) for the public badge
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v4.4.3
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4.39.5
        with:
          sarif_file: results.sarif
