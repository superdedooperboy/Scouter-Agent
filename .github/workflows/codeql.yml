# CodeQL static analysis for the Python agents.
#
# Scouter is pure Python standard library, so there is no build step — CodeQL analyzes the
# sources directly. Results land in the repo's Security → Code scanning tab.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '27 4 * * 1'   # weekly, Monday 04:27 UTC — catch newly-published query updates

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload CodeQL findings to code scanning
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3
        with:
          languages: python
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3
        with:
          category: "/language:python"
