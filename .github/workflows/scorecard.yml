# OpenSSF Scorecard — supply-chain posture scoring.
#
# Publishes results (publish_results: true) so the badge at
# https://securityscorecards.dev/viewer/?uri=github.com/superdedooperboy/Scouter-Agent works,
# and uploads SARIF to the Security → Code scanning tab. Public repo only.
name: Scorecard supply-chain

on:
  branch_protection_rule:
  schedule:
    - cron: '19 5 * * 1'   # weekly, Monday 05:19 UTC
  push:
    branches: [ main ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results (OIDC) for the public badge
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.4.3
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6  # v3
        with:
          sarif_file: results.sarif
